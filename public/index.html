<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one centered column like iPhone setup; packages widen to a three-card row on desktop. Single dark look by design. */
:root{
  --bg:#0A0A0B; --surface:#141416; --surface-2:#1C1C1F; --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.18);
  --fg:#F5F5F7; --muted:#A1A1A6; --faint:#6E6E73;
  --accent:#2997FF; --accent-soft:rgba(41,151,255,.13); --accent-line:rgba(41,151,255,.55);
  --danger:#FF7B72; --ok:#30D158;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:"";position:fixed;inset:-20% -10% auto;height:70vh;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 30%,rgba(41,151,255,.10),transparent 60%)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--bg) 60%,rgba(10,10,11,0))}
.top-in{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:15px;background:none;border:0;padding:4px 0}

.intro-logo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 30px);width:56px}
.pk-logo{width:52px;margin:0 auto 18px;display:block}
.done .brandline{display:flex;align-items:center;justify-content:center;gap:8px;margin:26px 0 0;color:var(--muted);font-size:14px}
.done .brandline .logo{width:22px}
.link{background:none;border:0;color:var(--accent);font-size:15px;padding:8px 2px;font-weight:500}
.link:hover{text-decoration:underline}
.progress{max-width:620px;margin:0 auto;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--fg);border-radius:3px;transition:width .5s var(--ease)}

/* Stage */
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(84px + env(safe-area-inset-top,0px)) 40px}
.screen{width:100%;max-width:560px;margin:auto;animation:enter .55s var(--ease) both}
.screen.wide{max-width:1080px}
.screen.still{animation:none}
.screen.leave{opacity:0;transform:translateY(-6px);transition:opacity .18s ease-in,transform .18s ease-in;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Intro and bridge */
.intro{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px));
  animation:fade .35s var(--ease) both}

  a.landing_page = location.pathname; a.referrer = document.referrer.slice(0,300);
  return a;

window.dataLayer = window.dataLayer || [];
function track(event, params){
  const data = Object.assign({event}, params||{});
  window.dataLayer.push(data);
  if (typeof window.gtag === "function") window.gtag("event", event, params||{});
}

/* ───────── Recommendation ───────── */
function recommend(){
  const {needs, goal} = S.answers;
  const byNeeds = {presence:"presence", contact:"connect", system:"growth"};
  if (byNeeds[needs]) return {id:byNeeds[needs], why:`You told us you want ${labelOf("needs",needs).toLowerCase()}.`};
  const byGoal = {professional:"presence", found:"connect", calls:"connect", replace:"connect", quotes:"growth"};
  if (byGoal[goal]) return {id:byGoal[goal], why:`You'd like your website to ${labelOf("goal",goal).charAt(0).toLowerCase()+labelOf("goal",goal).slice(1)}.`};
  return null;
}
function bridgeLines(){
  const {goal,status} = S.answers;
  if (goal === "calls" || goal === "quotes") return ["Perfect.","Your business needs more than a good-looking website.","It needs an easier way for customers to reach you.","Let's find the right fit."];
  if (goal === "replace" || status === "new" || status === "improve") return ["Your business has grown.","Your online presence should grow with it.","Let's explore your next step."];
  if (status === "none") return ["Every great business starts somewhere.","Let's give yours a professional place online.","Here are your options."];
  return ["Got it.","Let's match your goals to the right package.","Here are your options."];
}

/* ───────── Rendering ───────── */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const progressWrap = document.getElementById("progressWrap"), progressBar = document.getElementById("progressBar");

// Fade the current screen out before the next one fades in
const EXIT = reduced ? 0 : 180;
const leaving = () => !!app.querySelector(".screen.leave");
function swap(update){
  const cur = app.querySelector(".screen");
  if (!cur || !EXIT){ update(); return; }
  cur.classList.add("leave");
  later(update, EXIT);
}
function go(phase){
  clearTimers();
  swap(() => { delete app.dataset.step; delete app.dataset.phase; S.phase = phase; render(); window.scrollTo(0,0); });
}
function focusHeading(){ const h = app.querySelector("h1"); if (h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } }

function render(){
  document.querySelectorAll(".intro:not(.out)").forEach(n => { n.classList.add("out"); setTimeout(() => n.remove(), 450); });
  // Re-renders of the same screen (validation, sending state) shouldn't replay the entrance animation
  S.same = app.dataset.phase === S.phase; app.dataset.phase = S.phase;
  progressWrap.hidden = S.phase !== "quiz";
  ({intro:renderIntro, quiz:renderQuiz, bridge:renderBridge, packages:renderPackages, lead:renderLead, success:renderSuccess})[S.phase]();
}

/* Fading sequence used by the intro and the personalized bridge */
function playSequence(lines, {withDots, onDone, actions}){
  const ov = document.createElement("div");
  ov.className = "intro"; ov.setAttribute("role","region"); ov.setAttribute("aria-label","Introduction");
  ov.innerHTML = `<span class="logo intro-logo" role="img" aria-label="Nexus Luma"></span>` + (withDots ? `<div class="dots" aria-hidden="true">${lines.map(()=>"<i></i>").join("")}</div>` : "") +
    `<p class="line" aria-live="polite"></p>` + (actions ? `<div class="intro-actions">${actions}</div>` : "");
  document.body.appendChild(ov);
  const el = ov.querySelector(".line"), dots = ov.querySelectorAll(".dots i");
  let i = 0;
  const show = () => {
    el.textContent = lines[i];
    dots.forEach((d,k) => d.classList.toggle("on", k <= i));
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
    later(() => {
      if (i === lines.length - 1) { later(onDone, reduced ? 0 : 250); return; }
      el.classList.remove("show");
      later(() => { i++; show(); }, FADE);
    }, HOLD + FADE);
  };
  show();
  return ov;
}

  const still = app.dataset.step === String(S.step); app.dataset.step = S.step;
  app.innerHTML = `<section class="screen${still?" still":""}">
    <p class="eyebrow">Question ${S.step+1} of ${QUESTIONS.length}</p>

  const group = app.querySelector(".opts");
  group.addEventListener("click", e => { const b = e.target.closest(".opt"); if (b) choose(b.dataset.id); });
  group.addEventListener("keydown", e => {
    const opts = [...group.querySelectorAll(".opt")], i = opts.indexOf(document.activeElement);
    if (["ArrowDown","ArrowRight","ArrowUp","ArrowLeft"].includes(e.key) && i > -1){
      e.preventDefault(); const n = opts[(i + (e.key==="ArrowDown"||e.key==="ArrowRight" ? 1 : -1) + opts.length) % opts.length];
      choose(n.dataset.id, true);
    }
  });
  const bo = app.querySelector("#businessOther"); if (bo) bo.addEventListener("input", e => S.answers.businessOther = e.target.value);
  const su = app.querySelector("#siteUrl"); if (su) su.addEventListener("input", e => S.answers.url = e.target.value);
  app.querySelector("#next").addEventListener("click", next);
  app.querySelector("#back").addEventListener("click", () => {
    if (leaving()) return;
    if (S.step === 0) go("intro"); else { clearTimers(); swap(() => { S.step--; delete app.dataset.step; render(); }); }
  });
  if (!still) focusHeading();
}
function choose(id, viaKeys){
  const q = QUESTIONS[S.step];
  S.answers[q.id] = id;
  if (q.id === "status" && id === "none") S.answers.url = "";
  render();
  const btn = app.querySelector(`.opt[data-id="${id}"]`); if (btn) btn.focus({preventScroll:true});
  const hasExtra = (q.id==="business" && id==="other") || (q.id==="status" && id!=="none");
  // Auto-advance on a tap for questions with no follow-up field, so ready visitors move fast
  if (!viaKeys && !hasExtra) later(next, reduced ? 120 : 380);
}
function next(){
  if (leaving()) return;
  clearTimers();
  const q = QUESTIONS[S.step];
  if (!S.answers[q.id]) return;
  track("question_completed",{question_id:q.id, step:S.step+1});
  if (S.step < QUESTIONS.length - 1) swap(() => { S.step++; delete app.dataset.step; render(); });
  else { S.viaQuiz = true; track("questionnaire_completed"); progressBar.style.width = "100%"; go("bridge"); }
}

// Common misspellings of big email providers; the welcome email would bounce or go to a stranger
const EMAIL_TYPOS = {
  "gmial.com":"gmail.com","gmai.com":"gmail.com","gamil.com":"gmail.com","gnail.com":"gmail.com","gmal.com":"gmail.com",
  "gmail.co":"gmail.com","gmail.con":"gmail.com","gmail.cm":"gmail.com","gmail.om":"gmail.com",
  "hotmial.com":"hotmail.com","hotmal.com":"hotmail.com","hotmail.co":"hotmail.com","hotmail.con":"hotmail.com",
  "yaho.com":"yahoo.com","yahooo.com":"yahoo.com","yahoo.co":"yahoo.com","yahoo.con":"yahoo.com",
  "outlok.com":"outlook.com","outlook.co":"outlook.com","outlook.con":"outlook.com",
  "iclod.com":"icloud.com","icoud.com":"icloud.com","icloud.co":"icloud.com","icloud.con":"icloud.com"
};
function validate(){
  const f = S.form, e = {};
  if (!f.firstName.trim()) e.firstName = "Enter your first name.";
  const email = f.email.trim().toLowerCase(), [local, domain] = email.split("@");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) e.email = "Enter an email address like name@business.com.";
  else if (EMAIL_TYPOS[domain] && S.emailChecked !== email){
    S.emailChecked = email; // a second submit with the same address goes through
    e.email = `Did you mean ${local}@${EMAIL_TYPOS[domain]}? We'll send your welcome email here, so please double-check it.`;
  }
  const digits = f.phone.replace(/\D/g,"");
  if (digits.length < 10 || digits.length > 15) e.phone = "Enter a phone number with area code.";
  return e;
}

async function submit(){
  if (S.submitting) return;
  S.errors = validate(); S.submitError = "";
  if (Object.keys(S.errors).length){
    render();
    const first = app.querySelector('[aria-invalid="true"]'); if (first) first.focus();
    return;
  }
  if (S.form.hp) { S.phase = "success"; render(); return; } // honeypot: quietly drop bots, no lead, no conversion
  S.submitting = true; render();
  const p = pkgById(S.pkg), a = S.answers, f = S.form, now = new Date().toISOString();
  const lead = {
    client_request_id: (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random().toString(16).slice(2)),
    created_at: now,
    first_name: f.firstName.trim(), email: f.email.trim().toLowerCase(), phone: f.phone.trim(),
    business_name: f.businessName.trim(), business_location: f.location.trim(),
    business_category: a.business, business_category_other: a.businessOther.trim(),
    website_status: a.status, current_website_url: a.url.trim(),
    primary_goal: a.goal, desired_start: a.timing, website_needs: a.needs,
    completed_questionnaire: S.viaQuiz, recommended_package_id: (S.viaQuiz && recommend()) ? recommend().id : null,
    selected_package_id: p.id, selected_package_price: p.price, currency: "USD",
    notes: f.notes.trim(), marketing_consent: f.consent, marketing_consent_at: f.consent ? now : null,
    attribution, status: "New Project Request",
    // Readable answers for the lead sheet
    business_category_label: labelOf("business", a.business), primary_goal_label: labelOf("goal", a.goal),
    website_status_label: labelOf("status", a.status), desired_start_label: labelOf("timing", a.timing),
    website_needs_label: labelOf("needs", a.needs), selected_package_name: p.name
  };
  if (lead.recommended_package_id) lead.recommended_package_name = pkgById(lead.recommended_package_id).name;
  try {
    const saved = await saveLead(lead);
    S.lead = Object.assign({}, lead, {id: saved.id, preview: saved.preview});
    S.submitting = false;
    track("lead_submitted",{package_id:p.id, value:p.price, currency:"USD"});
    if (!S.converted){
      S.converted = true;
      if (ADS_CONVERSION_SEND_TO && typeof window.gtag === "function")
        window.gtag("event","conversion",{send_to:ADS_CONVERSION_SEND_TO, value:p.price, currency:"USD", transaction_id:saved.id});
    }
    go("success");
  } catch(err){
    S.submitting = false;
    S.submitError = "We couldn't send your request. Your details are still here, so tap Retry.";
    track("lead_submission_failed",{package_id:p.id});
    render();
  }
}

async function saveLead(lead){
  if (!LEAD_ENDPOINT){
    await new Promise(r => setTimeout(r, 900));
    return {id: "preview-" + lead.client_request_id.slice(0,8), preview:true};
  }
  // Google Apps Script can't answer CORS preflights, so send it a "simple" request (text/plain, no custom headers).
  const appsScript = /script\.google(usercontent)?\.com/.test(LEAD_ENDPOINT);
  const res = await fetch(LEAD_ENDPOINT, appsScript
    ? {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(lead)}
    : {method:"POST", headers:{"Content-Type":"application/json","Idempotency-Key":lead.client_request_id}, body:JSON.stringify(lead)});
  if (!res.ok) throw new Error("save failed " + res.status);
  const data = await res.json();
  if (!data || !data.id) throw new Error("no id returned");
  return data;
}
